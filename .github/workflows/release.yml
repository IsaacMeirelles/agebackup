name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ex.: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Instalar dependências
        run: uv sync --group dev

      - name: Compilar binários
        run: ./packaging/build.sh

      - name: Montar pacote de distribuição
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          versao="${tag#v}"
          staging="dist/agebackup-${versao}-linux-x86_64"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp dist/agebackup-gui dist/agebackup-backup dist/agebackup-setup \
             dist/agebackup-compactar dist/agebackup-enviar "$staging/"
          cp README.md USERGUIDE.md DEPLOY.md REQUISITOS.md "$staging/"
          (
            cd "$staging"
            sha256sum agebackup-gui agebackup-backup agebackup-setup \
              agebackup-compactar agebackup-enviar > SHA256SUMS
          )
          tar -C dist -czf "dist/agebackup-${versao}-linux-x86_64.tar.gz" \
            "agebackup-${versao}-linux-x86_64"
          (
            cd dist
            sha256sum "agebackup-${versao}-linux-x86_64.tar.gz" \
              > "agebackup-${versao}-linux-x86_64.tar.gz.sha256"
          )

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: AgeBackup ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/agebackup-gui
            dist/agebackup-backup
            dist/agebackup-setup
            dist/agebackup-compactar
            dist/agebackup-enviar
            dist/agebackup-*-linux-x86_64.tar.gz
            dist/agebackup-*-linux-x86_64.tar.gz.sha256
